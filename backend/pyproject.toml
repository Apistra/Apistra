[project]
name = "apistra-backend"
version = "0.0.0"
description = "Apistra backend architecture foundation"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "import-linter==2.15",
  "pytest==9.1.1",
]

[tool.uv]
required-version = "==0.12.20"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/apistra"]
