name: Bug report
description: Report a reproducible defect in Apistra.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, or security vulnerabilities here. Use SECURITY.md for vulnerabilities.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the deployment marker and correlation ID if available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
