name: CI

on:
  pull_request:
    branches: [test, staging, main]
  push:
    branches:
      - "feature/**"
      - test
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-python:
    name: Architecture / Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked Python dependencies
        run: uv sync --project backend --locked --group dev

      - name: Run Python architecture tests and proof fixtures
        run: uv run --project backend pytest backend/tests/architecture

      - name: Run Import Linter contracts
        env:
          PYTHONPATH: backend/src
        run: uv run --project backend lint-imports --config backend/.importlinter

  architecture-typescript:
    name: Architecture / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@12.8.1 --activate

      - name: Install locked TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript architecture tests and proof fixtures
        run: pnpm architecture
